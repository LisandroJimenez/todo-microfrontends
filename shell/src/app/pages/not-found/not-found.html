<section class="not-found">
  <mat-card appearance="outlined" class="not-found-card">
    <mat-icon
      class="material-icons not-found-icon"
      aria-hidden="true"
    >
      error_outline
    </mat-icon>

    <h1>Página no encontrada</h1>

    <p>
      La dirección que intentaste abrir no existe.
    </p>

    <a
      matButton="filled"
      routerLink="/"
    >
      <mat-icon
        class="material-icons"
        aria-hidden="true"
      >
        home
      </mat-icon>

      Volver al inicio
    </a>
  </mat-card>
</section>
